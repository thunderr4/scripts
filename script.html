<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>script</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

body {
margin: 0;
font-family: Inter;
background: #000;
color: #fff;
padding: 16px;
}

/* header */
#top {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 12px;
}

/* title */
#title {
font-weight: 900;
font-size: 18px;
}

/* buttons */
.btn {
background: #0a0a0a;
border: 1px solid #2a2a2a;
color: #fff;
padding: 6px 10px;
border-radius: 6px;
cursor: pointer;
font-weight: 900;
}

.btn:hover {
border-color: #fff;
}

/* actions row */
#actions {
display: flex;
gap: 6px;
margin-bottom: 12px;
}

/* code box */
#codebox {
background: #050505;
border: 1px solid #1a1a1a;
padding: 12px;
border-radius: 8px;
font-family: monospace;
font-weight: 700;
white-space: pre-wrap;
line-height: 1.4;
}

/* simple color styling */
.keyword {
color: #4da6ff;
}

.string {
color: #6ee7b7;
}

.number {
color: #facc15;
}
</style>
</head>

<body>

<div id="top">
<div id="title">script</div>
<div class="btn" onclick="goBack()">back</div>
</div>

<div id="actions">
<div class="btn" onclick="copyScript()">copy</div>
<div class="btn" onclick="downloadScript()">download</div>
</div>

<div id="codebox"></div>

<script>
let id = new URLSearchParams(location.search).get("id");

let scripts = JSON.parse(localStorage.getItem("scripts") || "[]");

let found = scripts.find(s => s.id === id);

/* set title */
document.getElementById("title").innerText =
found ? found.name : "script";

/* syntax highlight (simple) */
function colorize(code) {
return code
.replace(/"(.*?)"/g, '<span class="string">"$1"</span>')
.replace(/\b(\d+)\b/g, '<span class="number">$1</span>')
.replace(/\b(function|local|let|var|return|if|then|end)\b/g,
'<span class="keyword">$1</span>');
}

/* render code */
let codebox = document.getElementById("codebox");

if (found) {
codebox.innerHTML = colorize(found.content);
} else {
codebox.innerText = "script not found";
}

/* buttons */
function goBack() {
history.back();
}

function copyScript() {
if (!found) return;
navigator.clipboard.writeText(found.content);
alert("copied");
}

function downloadScript() {
if (!found) return;

let blob = new Blob([found.content], {type: "text/plain"});
let a = document.createElement("a");
a.href = URL.createObjectURL(blob);
a.download = found.name + ".txt";
a.click();
}
</script>

</body>
</html>
