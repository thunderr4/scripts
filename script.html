<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>script</title>

<style>
body {
margin: 0;
font-family: Inter;
background: #000;
color: #fff;
padding: 16px;
white-space: pre-wrap;
}

.back {
display: inline-block;
padding: 6px 10px;
border: 1px solid #2a2a2a;
border-radius: 6px;
cursor: pointer;
margin-bottom: 10px;
}
</style>
</head>

<body>

<div class="back" onclick="history.back()">back</div>

<pre id="out"></pre>

<script>
let id = new URLSearchParams(location.search).get("id");

let scripts = JSON.parse(localStorage.getItem("scripts") || "[]");

let found = scripts.find(s => s.id === id);

document.getElementById("out").innerText =
found ? found.content : "script not found";
</script>

</body>
</html>
