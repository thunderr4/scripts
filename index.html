<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>thunder's scripts</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

body {
margin: 0;
font-family: Inter, Arial;
background: #000;
color: #fff;
}

/* top bar */
#topbar {
display: flex;
align-items: center;
justify-content: space-between;
padding: 14px;
background: #000;
border-bottom: 1px solid #1a1a1a;
}

/* left title area */
#left {
display: flex;
align-items: center;
gap: 10px;
}

/* circle image */
#logo {
width: 34px;
height: 34px;
border-radius: 50%;
background: #111;
object-fit: cover;
border: 1px solid #333;
}

/* title */
#title {
font-weight: 900;
letter-spacing: 1px;
}

/* button */
button {
background: #0a0a0a;
color: #fff;
border: 1px solid #2a2a2a;
padding: 8px 12px;
border-radius: 6px;
font-weight: 700;
cursor: pointer;
}

button:hover {
border-color: #fff;
}

/* container */
#container {
padding: 16px;
}

/* script card */
.script {
border: 1px solid #1a1a1a;
padding: 12px;
margin: 10px 0;
border-radius: 8px;
font-weight: 700;
background: #000;
}

.script:hover {
border-color: #fff;
}
</style>
</head>

<body>

<div id="topbar">

<div id="left">
<img id="logo" src="images/logo.png">
<div id="title">thunder's scripts</div>
</div>

<button onclick="createScript()">create</button>

</div>

<div id="container">

<div class="script">sprint system</div>
<div class="script">round system</div>
<div class="script">ui handler</div>

</div>

<script>
function createScript() {
let pass = prompt("enter password");

if (pass !== "test") {
alert("wrong password");
return;
}

let name = prompt("script name");
if (!name) return;

let div = document.createElement("div");
div.className = "script";
div.innerText = name;

document.getElementById("container").appendChild(div);
}
</script>

</body>
</html>
