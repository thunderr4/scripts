<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>thunder's scripts</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

body {
margin: 0;
font-family: Inter;
background: #000;
color: #fff;
opacity: 0;
animation: fadein 0.5s ease forwards;
}

@keyframes fadein {
to { opacity: 1; }
}

/* topbar */
#topbar {
display: flex;
justify-content: space-between;
align-items: center;
padding: 12px;
border-bottom: 1px solid #1a1a1a;
}

#left {
display: flex;
align-items: center;
gap: 10px;
}

#menuBtn {
cursor: pointer;
font-size: 22px;
padding: 4px 8px;
border: 1px solid #2a2a2a;
border-radius: 6px;
}

#title {
font-weight: 900;
}

/* buttons */
button {
background: #0a0a0a;
color: #fff;
border: 1px solid #2a2a2a;
padding: 7px 10px;
border-radius: 6px;
cursor: pointer;
font-weight: 700;
}

/* sidebar */
#sidebar {
position: fixed;
left: -240px;
top: 0;
width: 200px;
height: 100%;
background: #0a0a0a;
border-right: 1px solid #1a1a1a;
padding: 16px;
transition: 0.3s ease;
}

#sidebar.open {
left: 0;
}

#sideTop {
display: flex;
justify-content: space-between;
align-items: center;
}

#close {
cursor: pointer;
border: 1px solid #2a2a2a;
padding: 2px 8px;
border-radius: 6px;
}

/* scripts */
#container {
padding: 16px;
}

.script {
border: 1px solid #1a1a1a;
padding: 12px;
border-radius: 8px;
margin: 10px 0;
cursor: pointer;
background: #000;
}

.namebox {
background: #0a0a0a;
padding: 8px;
border-radius: 6px;
border: 1px solid #1f1f1f;
font-weight: 900;
}

.date {
font-size: 12px;
color: #aaa;
margin-top: 4px;
}

/* modals */
.modal {
position: fixed;
inset: 0;
display: none;
align-items: center;
justify-content: center;
background: rgba(0,0,0,0.85);
}

.box {
background: #0a0a0a;
border: 1px solid #2a2a2a;
padding: 16px;
border-radius: 10px;
width: 280px;
display: flex;
flex-direction: column;
gap: 10px;
}

input, textarea {
background: #000;
color: #fff;
border: 1px solid #2a2a2a;
padding: 8px;
border-radius: 6px;
outline: none;
}

textarea {
height: 80px;
resize: none;
}
</style>
</head>

<body>

<!-- sidebar -->
<div id="sidebar">
<div id="sideTop">
<div>categories</div>
<div id="close" onclick="toggleSidebar()">x</div>
</div>
</div>

<!-- topbar -->
<div id="topbar">

<div id="left">
<div id="menuBtn" onclick="toggleSidebar()">☰</div>
<div id="title">thunder's scripts</div>
</div>

<button id="loginBtn" onclick="openLogin()">login</button>

</div>

<div id="container"></div>

<!-- login -->
<div class="modal" id="loginModal">
<div class="box">
<div>login</div>
<input id="pass">
<button onclick="checkLogin()">enter</button>
</div>
</div>

<!-- add script -->
<div class="modal" id="addModal">
<div class="box">
<div>add script</div>

<div>name</div>
<input id="name">

<div>content</div>
<textarea id="content"></textarea>

<button onclick="addScript()">submit</button>
</div>
</div>

<script>
let loggedIn = false;

let scripts = JSON.parse(localStorage.getItem("scripts") || "[]");

/* sidebar */
function toggleSidebar() {
document.getElementById("sidebar").classList.toggle("open");
}

/* login */
function openLogin() {
document.getElementById("loginModal").style.display = "flex";
}

function checkLogin() {
let pass = document.getElementById("pass").value;

if (pass !== "test") {
document.getElementById("loginModal").style.display = "none";
alert("wrong password");
return;
}

loggedIn = true;
document.getElementById("loginModal").style.display = "none";
document.getElementById("loginBtn").remove();

let btn = document.createElement("button");
btn.innerText = "+ add script";
btn.onclick = () => {
document.getElementById("addModal").style.display = "flex";
};

document.getElementById("topbar").appendChild(btn);
}

/* add script */
function addScript() {
let name = document.getElementById("name").value;
let content = document.getElementById("content").value;

if (!name || !content) return;

scripts.push({
id: crypto.randomUUID(),
name,
content,
date: new Date().toLocaleDateString()
});

localStorage.setItem("scripts", JSON.stringify(scripts));

document.getElementById("addModal").style.display = "none";
render();
}

/* open script page */
function openScript(id) {
window.location.href = "script.html?id=" + id;
}

/* render */
function render() {
let container = document.getElementById("container");
container.innerHTML = "";

scripts.forEach(s => {
let div = document.createElement("div");
div.className = "script";

div.onclick = () => openScript(s.id);

div.innerHTML = `
<div class="namebox">${s.name}</div>
<div class="date">added ${s.date}</div>
`;

container.appendChild(div);
});
}

render();
</script>

</body>
</html>
