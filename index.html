<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>thunder's scripts</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

body {
margin: 0;
font-family: Inter, Arial;
background: #000;
color: #fff;
}

/* top bar */
#topbar {
display: flex;
align-items: center;
justify-content: space-between;
padding: 14px;
border-bottom: 1px solid #1a1a1a;
}

#left {
display: flex;
align-items: center;
gap: 10px;
}

#logo {
width: 34px;
height: 34px;
border-radius: 50%;
object-fit: cover;
border: 1px solid #333;
background: #111;
}

#title {
font-weight: 900;
}

/* button */
button {
background: #0a0a0a;
color: #fff;
border: 1px solid #2a2a2a;
padding: 8px 12px;
border-radius: 6px;
font-weight: 700;
cursor: pointer;
}

button:hover {
border-color: #fff;
}

/* container */
#container {
padding: 16px;
}

/* script card */
.script {
border: 1px solid #1a1a1a;
padding: 12px;
margin: 10px 0;
border-radius: 8px;
display: flex;
justify-content: space-between;
align-items: center;
font-weight: 700;
}

.script button {
padding: 6px 10px;
font-size: 12px;
}
</style>
</head>

<body>

<div id="topbar">
<div id="left">
<img id="logo" src="images/logo.png">
<div id="title">thunder's scripts</div>
</div>

<button onclick="devPanel()">dev</button>
</div>

<div id="container"></div>

<script>
let scripts = JSON.parse(localStorage.getItem("scripts") || "[]");

function render() {
let container = document.getElementById("container");
container.innerHTML = "";

for (let i = 0; i < scripts.length; i++) {
let div = document.createElement("div");
div.className = "script";

div.innerHTML = `
<span>${scripts[i]}</span>
<button onclick="deleteScript(${i})">delete</button>
`;

container.appendChild(div);
}
}

function devPanel() {
let pass = prompt("enter password");

if (pass !== "test") return;

let name = prompt("script name");
if (!name) return;

scripts.push(name);
localStorage.setItem("scripts", JSON.stringify(scripts));
render();
}

function deleteScript(index) {
scripts.splice(index, 1);
localStorage.setItem("scripts", JSON.stringify(scripts));
render();
}

render();
</script>

</body>
</html>
