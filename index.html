<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>thunder's scripts</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

body {
margin: 0;
font-family: Inter;
background: #000;
color: #fff;
opacity: 0;
animation: fadein 0.5s ease forwards;
}

@keyframes fadein {
to { opacity: 1; }
}

/* topbar */
#topbar {
display: flex;
justify-content: space-between;
align-items: center;
padding: 12px;
border-bottom: 1px solid #1a1a1a;
}

#left {
display: flex;
align-items: center;
gap: 10px;
}

#menuBtn {
cursor: pointer;
padding: 4px 8px;
border: 1px solid #2a2a2a;
border-radius: 6px;
font-weight: 900;
}

#title {
font-weight: 900;
}

/* buttons */
button {
background: #0a0a0a;
color: #fff;
border: 1px solid #2a2a2a;
padding: 7px 10px;
border-radius: 6px;
cursor: pointer;
font-weight: 900;
}

button:hover {
border-color: #fff;
}

/* script card */
.script {
border: 1px solid #1a1a1a;
border-radius: 10px;
padding: 12px;
margin: 10px 0;
background: #000;
}

.scriptTop {
display: flex;
gap: 10px;
align-items: center;
}

.script img {
width: 45px;
height: 45px;
border-radius: 8px;
object-fit: cover;
border: 1px solid #222;
}

.name {
font-weight: 900;
font-size: 15px;
}

.date {
font-size: 12px;
color: #aaa;
}

/* actions row */
.actions {
display: flex;
gap: 6px;
margin-top: 10px;
flex-wrap: wrap;
}

.tag {
font-weight: 900;
font-size: 12px;
color: #fff;
border: 1px solid #2a2a2a;
padding: 4px 8px;
border-radius: 6px;
}

/* modal */
.modal {
position: fixed;
inset: 0;
display: none;
align-items: center;
justify-content: center;
background: rgba(0,0,0,0.85);
}

.box {
background: #0a0a0a;
border: 1px solid #2a2a2a;
padding: 16px;
border-radius: 10px;
width: 280px;
display: flex;
flex-direction: column;
gap: 10px;
}

input, textarea {
background: #000;
color: #fff;
border: 1px solid #2a2a2a;
padding: 8px;
border-radius: 6px;
outline: none;
}

textarea {
height: 70px;
resize: none;
}
</style>
</head>

<body>

<div id="topbar">

<div id="left">
<div id="menuBtn">☰</div>
<div id="title">thunder's scripts</div>
</div>

<button onclick="openLogin()">login</button>

</div>

<div id="container"></div>

<!-- login -->
<div class="modal" id="loginModal">
<div class="box">
<div class="tag">login</div>
<input id="pass">
<button onclick="login()">enter</button>
</div>
</div>

<!-- add script -->
<div class="modal" id="addModal">
<div class="box">
<div class="tag">add script</div>

<input id="name" placeholder="name">
<input id="img" placeholder="image url (optional)">
<textarea id="content" placeholder="script content"></textarea>

<button onclick="addScript()">submit</button>
</div>
</div>

<script>
let loggedIn = false;

let scripts = JSON.parse(localStorage.getItem("scripts") || "[]");

/* login */
function openLogin() {
document.getElementById("loginModal").style.display = "flex";
}

function login() {
let pass = document.getElementById("pass").value;

if (pass !== "test") {
document.getElementById("loginModal").style.display = "none";
alert("wrong password");
return;
}

loggedIn = true;
document.getElementById("loginModal").style.display = "none";
}

/* add script */
function addScript() {
let name = document.getElementById("name").value;
let content = document.getElementById("content").value;
let img = document.getElementById("img").value || "https://via.placeholder.com/80";

if (!name || !content) return;

scripts.push({
id: crypto.randomUUID(),
name,
content,
img,
likes: 0,
date: new Date().toLocaleDateString()
});

localStorage.setItem("scripts", JSON.stringify(scripts));

document.getElementById("addModal").style.display = "none";
render();
}

/* actions */
function like(id) {
let s = scripts.find(x => x.id === id);
s.likes++;
localStorage.setItem("scripts", JSON.stringify(scripts));
render();
}

function copy(content) {
navigator.clipboard.writeText(content);
alert("copied");
}

function downloadScript(s) {
let blob = new Blob([s.content], {type: "text/plain"});
let a = document.createElement("a");
a.href = URL.createObjectURL(blob);
a.download = s.name + ".txt";
a.click();
}

/* render */
function render() {
let container = document.getElementById("container");
container.innerHTML = "";

scripts.forEach(s => {

let div = document.createElement("div");
div.className = "script";

div.innerHTML = `
<div class="scriptTop">
<img src="${s.img}">
<div>
<div class="name">${s.name}</div>
<div class="date">added ${s.date}</div>
</div>
</div>

<div class="actions">
<div class="tag">likes: ${s.likes}</div>
<button onclick="like('${s.id}')">like</button>
<button onclick="copy(\`${s.content}\`)">copy</button>
<button onclick="downloadScript(${JSON.stringify(s).replace(/"/g, '&quot;')})">download</button>
</div>
`;

container.appendChild(div);
});
}

render();
</script>

</body>
</html>
