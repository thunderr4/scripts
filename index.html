<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>thunder's scripts</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

body {
margin: 0;
font-family: Inter, Arial;
background: #000;
color: #fff;
}

/* top bar */
#topbar {
display: flex;
align-items: center;
justify-content: space-between;
padding: 14px;
border-bottom: 1px solid #1a1a1a;
}

#left {
display: flex;
align-items: center;
gap: 10px;
}

#logo {
width: 34px;
height: 34px;
border-radius: 50%;
object-fit: cover;
border: 1px solid #333;
background: #111;
}

#title {
font-weight: 900;
}

/* search */
#searchwrap {
display: flex;
align-items: center;
gap: 6px;
border: 1px solid #2a2a2a;
padding: 6px 10px;
border-radius: 6px;
background: #050505;
}

#searchwrap span {
color: #aaa;
font-size: 14px;
}

#search {
background: transparent;
border: none;
outline: none;
color: #fff;
}

/* button */
button {
background: #0a0a0a;
color: #fff;
border: 1px solid #2a2a2a;
padding: 8px 12px;
border-radius: 6px;
font-weight: 700;
cursor: pointer;
}

button:hover {
border-color: #fff;
}

/* container */
#container {
padding: 16px;
}

/* script card */
.script {
border: 1px solid #1a1a1a;
padding: 12px;
margin: 10px 0;
border-radius: 8px;
display: flex;
justify-content: space-between;
align-items: center;
}

.meta {
display: flex;
flex-direction: column;
gap: 4px;
}

.name {
font-weight: 900;
}

.date {
font-size: 12px;
color: #aaa;
}

.script button {
padding: 6px 10px;
font-size: 12px;
}

/* popup */
#popup {
position: fixed;
inset: 0;
background: rgba(0,0,0,0.8);
display: none;
align-items: center;
justify-content: center;
}

#box {
background: #0a0a0a;
border: 1px solid #2a2a2a;
padding: 20px;
border-radius: 10px;
width: 260px;
display: flex;
flex-direction: column;
gap: 10px;
}

#box input {
padding: 8px;
background: #000;
border: 1px solid #2a2a2a;
color: #fff;
border-radius: 6px;
outline: none;
}
</style>
</head>

<body>

<div id="topbar">

<div id="left">
<img id="logo" src="images/logo.png">
<div id="title">thunder's scripts</div>
</div>

<div id="searchwrap">
<span>🔍</span>
<input id="search" placeholder="search..." oninput="render()">
</div>

<button onclick="openLogin()">login</button>

</div>

<div id="container"></div>

<!-- popup -->
<div id="popup">
<div id="box">
<input id="pass" placeholder="enter password">
<button onclick="login()">enter</button>
</div>
</div>

<script>
let scripts = JSON.parse(localStorage.getItem("scripts") || "[]");

function render() {
let container = document.getElementById("container");
let search = document.getElementById("search").value.toLowerCase();

container.innerHTML = "";

scripts.forEach((s, i) => {
if (search && !s.name.toLowerCase().includes(search)) return;

let div = document.createElement("div");
div.className = "script";

div.innerHTML = `
<div class="meta">
<div class="name">${s.name}</div>
<div class="date">added ${s.date}</div>
</div>
<button onclick="deleteScript(${i})">delete</button>
`;

container.appendChild(div);
});
}

function openLogin() {
document.getElementById("popup").style.display = "flex";
}

function login() {
let pass = document.getElementById("pass").value;

if (pass !== "test") return;

document.getElementById("popup").style.display = "none";

let name = prompt("script name");
if (!name) return;

let date = new Date().toLocaleDateString();

scripts.push({ name, date });

localStorage.setItem("scripts", JSON.stringify(scripts));
render();
}

function deleteScript(i) {
scripts.splice(i, 1);
localStorage.setItem("scripts", JSON.stringify(scripts));
render();
}

render();
</script>

</body>
</html>
