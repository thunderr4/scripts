<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>thunder's scripts</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

body {
margin: 0;
font-family: Inter, Arial;
background: #000;
color: #fff;
opacity: 0;
animation: fadein 0.5s ease forwards;
}

@keyframes fadein {
to { opacity: 1; }
}

/* top bar */
#topbar {
display: flex;
align-items: center;
justify-content: space-between;
padding: 12px;
border-bottom: 1px solid #1a1a1a;
}

#left {
display: flex;
align-items: center;
gap: 10px;
}

#menuBtn {
font-size: 22px;
cursor: pointer;
padding: 4px 8px;
border: 1px solid #2a2a2a;
border-radius: 6px;
}

/* logo */
#logo {
width: 32px;
height: 32px;
border-radius: 50%;
object-fit: cover;
border: 1px solid #333;
background: #111;
}

#title {
font-weight: 900;
}

/* buttons */
button {
background: #0a0a0a;
color: #fff;
border: 1px solid #2a2a2a;
padding: 7px 10px;
border-radius: 6px;
font-weight: 700;
cursor: pointer;
}

button:hover {
border-color: #fff;
}

/* sidebar (fully hidden now) */
#sidebar {
position: fixed;
top: 0;
left: -260px;
width: 220px;
height: 100%;
background: #0a0a0a;
border-right: 1px solid #1a1a1a;
padding: 16px;
transition: 0.3s ease;
z-index: 10;
}

#sidebar.open {
left: 0;
}

/* sidebar header */
#sideTop {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 10px;
}

#sideTitle {
font-weight: 900;
}

/* X button */
#closeBtn {
cursor: pointer;
font-size: 18px;
border: 1px solid #2a2a2a;
padding: 2px 8px;
border-radius: 6px;
}

.cat {
padding: 8px;
border: 1px solid #1f1f1f;
border-radius: 6px;
margin-bottom: 8px;
font-size: 13px;
}

/* container */
#container {
padding: 16px;
}

/* script */
.script {
border: 1px solid #1a1a1a;
border-radius: 8px;
padding: 12px;
margin: 10px 0;
background: #000;
}

.namebox {
background: #0a0a0a;
border: 1px solid #1f1f1f;
padding: 8px 10px;
border-radius: 6px;
font-weight: 900;
}

.date {
font-size: 12px;
color: #aaa;
margin-top: 4px;
}
</style>
</head>

<body>

<div id="sidebar">

<div id="sideTop">
<div id="sideTitle">categories</div>
<div id="closeBtn" onclick="toggleSidebar()">x</div>
</div>

<div class="cat">all</div>
<div class="cat">ui</div>
<div class="cat">combat</div>
<div class="cat">systems</div>

</div>

<div id="topbar">

<div id="left">
<div id="menuBtn" onclick="toggleSidebar()">☰</div>
<img id="logo" src="images/logo.png">
<div id="title">thunder's scripts</div>
</div>

<button id="loginBtn" onclick="openLogin()">login</button>

</div>

<div id="container"></div>

<script>
let sidebarOpen = false;

function toggleSidebar() {
sidebarOpen = !sidebarOpen;
document.getElementById("sidebar").classList.toggle("open");
}

/* login system placeholder */
function openLogin() {
let pass = prompt("enter password");
if (pass === "test") {
alert("logged in");
document.getElementById("loginBtn").remove();
} else {
alert("wrong password");
}
}

/* demo scripts */
let scripts = [
{name:"sprint system", date:"today"},
{name:"ui handler", date:"today"}
];

function render() {
let container = document.getElementById("container");
container.innerHTML = "";

scripts.forEach(s => {
let div = document.createElement("div");
div.className = "script";

div.innerHTML = `
<div class="namebox">${s.name}</div>
<div class="date">added ${s.date}</div>
`;

container.appendChild(div);
});
}

render();
</script>

</body>
</html>
