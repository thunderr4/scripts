<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>thunder's scripts</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

body {
margin: 0;
font-family: Inter, Arial;
background: #000;
color: #fff;
opacity: 0;
animation: fadein 0.5s ease forwards;
}

@keyframes fadein {
to { opacity: 1; }
}

/* top bar */
#topbar {
display: flex;
align-items: center;
justify-content: space-between;
padding: 12px;
border-bottom: 1px solid #1a1a1a;
gap: 10px;
}

#left {
display: flex;
align-items: center;
gap: 10px;
}

#logo {
width: 32px;
height: 32px;
border-radius: 50%;
object-fit: cover;
border: 1px solid #333;
background: #111;
}

#title {
font-weight: 900;
}

/* search */
#searchwrap {
display: flex;
align-items: center;
gap: 6px;
border: 1px solid #2a2a2a;
padding: 6px 10px;
border-radius: 6px;
background: #050505;
flex: 1;
max-width: 320px;
}

#searchwrap span {
color: #aaa;
}

#search {
background: transparent;
border: none;
outline: none;
color: #fff;
width: 100%;
}

/* buttons */
button {
background: #0a0a0a;
color: #fff;
border: 1px solid #2a2a2a;
padding: 7px 10px;
border-radius: 6px;
font-weight: 700;
cursor: pointer;
}

button:hover {
border-color: #fff;
}

/* container */
#container {
padding: 16px;
}

/* script card */
.script {
border: 1px solid #1a1a1a;
border-radius: 8px;
padding: 12px;
margin: 10px 0;
display: flex;
justify-content: space-between;
align-items: center;
background: #000;
}

/* fancy script name block */
.namebox {
background: #0a0a0a;
border: 1px solid #1f1f1f;
padding: 8px 10px;
border-radius: 6px;
display: inline-block;
font-weight: 900;
}

.date {
font-size: 12px;
color: #aaa;
margin-top: 4px;
}

/* left side of card */
.meta {
display: flex;
flex-direction: column;
}

/* modal background */
.modal {
position: fixed;
inset: 0;
background: rgba(0,0,0,0.85);
display: none;
align-items: center;
justify-content: center;
}

/* modal box */
.box {
background: #0a0a0a;
border: 1px solid #2a2a2a;
padding: 16px;
border-radius: 10px;
width: 260px;
display: flex;
flex-direction: column;
gap: 10px;
text-align: center;
}

/* modal title */
.boxtitle {
font-weight: 900;
font-size: 16px;
}

/* inputs */
input {
padding: 8px;
background: #000;
border: 1px solid #2a2a2a;
color: #fff;
border-radius: 6px;
outline: none;
}
</style>
</head>

<body>

<div id="topbar">

<div id="left">
<img id="logo" src="images/logo.png">
<div id="title">thunder's scripts</div>
</div>

<div id="searchwrap">
<span>🔍</span>
<input id="search" placeholder="search..." oninput="render()">
</div>

<button onclick="openLogin()">login</button>

</div>

<div id="container"></div>

<!-- login modal -->
<div class="modal" id="loginModal">
<div class="box">
<div class="boxtitle">login</div>
<input id="pass" placeholder="enter password">
<button onclick="login()">enter</button>
</div>
</div>

<!-- add script modal -->
<div class="modal" id="addModal">
<div class="box">
<div class="boxtitle">add script</div>
<input id="scriptName" placeholder="script name">
<button onclick="addScript()">submit</button>
</div>
</div>

<script>
let loggedIn = false;

let scripts = JSON.parse(localStorage.getItem("scripts") || "[]");

function render() {
let container = document.getElementById("container");
let search = document.getElementById("search").value.toLowerCase();

container.innerHTML = "";

scripts.forEach((s, i) => {
if (search && !s.name.toLowerCase().includes(search)) return;

let div = document.createElement("div");
div.className = "script";

div.innerHTML = `
<div class="meta">
<div class="namebox">${s.name}</div>
<div class="date">added ${s.date}</div>
</div>
${loggedIn ? `<button onclick="deleteScript(${i})">delete</button>` : ""}
`;

container.appendChild(div);
});
}

function openLogin() {
document.getElementById("loginModal").style.display = "flex";
}

function login() {
let pass = document.getElementById("pass").value;

if (pass !== "test") {
document.getElementById("loginModal").style.display = "none";
alert("wrong password");
return;
}

loggedIn = true;
document.getElementById("loginModal").style.display = "none";
render();
}

function openAdd() {
document.getElementById("addModal").style.display = "flex";
}

function addScript() {
let name = document.getElementById("scriptName").value;
if (!name) return;

let date = new Date().toLocaleDateString();

scripts.push({ name, date });

localStorage.setItem("scripts", JSON.stringify(scripts));

document.getElementById("addModal").style.display = "none";
document.getElementById("scriptName").value = "";

render();
}

function deleteScript(i) {
if (!loggedIn) return;

scripts.splice(i, 1);
localStorage.setItem("scripts", JSON.stringify(scripts));
render();
}

/* inject add button only when logged in */
setInterval(() => {
let topbar = document.getElementById("topbar");

if (loggedIn && !document.getElementById("addBtn")) {
let btn = document.createElement("button");
btn.innerText = "+ add script";
btn.id = "addBtn";
btn.onclick = openAdd;
topbar.appendChild(btn);
}
}, 300);

render();
</script>

</body>
</html>
